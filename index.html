<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Valentine Game</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7; --bg2:#ffeef6; --card:#ffffffcc;
      --yes:#ff3b7a; --yesHover:#ff1f68;
      --ink:#111827;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100svh;
      display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at top,var(--bg2),var(--bg1));
      font-family:system-ui,sans-serif;
      overflow:hidden;
      padding:16px;
      color:var(--ink);
    }

    /* card a tiny bit higher */
    .wrap{ width:100%; display:flex; justify-content:center; transform:translateY(-18px); }

    #confettiCanvas,#hearts{
      position:fixed; inset:0; width:100vw; height:100vh;
      pointer-events:none;
    }
    #hearts span{
      position:absolute; bottom:-20px;
      font-size:24px; animation:floatUp linear infinite;
      opacity:.9;
    }
    @keyframes floatUp{
      from{transform:translateY(0) scale(.8); opacity:1}
      to{transform:translateY(-110vh) scale(1.4); opacity:0}
    }

    .card{
      width:min(720px,92vw);
      padding:26px 22px;
      background:var(--card);
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.15);
      position:relative;
    }

    h1{
      font-size:clamp(26px,4.2vw,46px);
      margin:8px 0 8px;
      font-weight:900;
      letter-spacing:-.02em;
    }
    .text{
      font-size:16px;
      opacity:.9;
      margin:0 auto 14px;
      max-width:56ch;
      line-height:1.35;
    }

    .hint{
      margin-top:14px;
      font-size:13px;
      opacity:.8;
      min-height:18px;
    }

    /* zone for moving buttons */
    .button-zone{
      position:relative;
      width:min(540px,96%);
      height:170px;
      margin:10px auto 0;
      touch-action:none;
    }

    button{
      border:none; cursor:pointer; font-weight:900;
      border-radius:999px;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      user-select:none;
    }

    /* main two buttons */
    .btn-main{
      position:absolute;
      padding:16px 24px;
      font-size:18px;
    }
    #btnA{ background:var(--yes); color:#fff; }
    #btnA:hover{ background:var(--yesHover); }
    #btnB{ background:#e5e7eb; color:#111; }

    /* centered actions/options */
    .actions{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .btn-option{
      padding:14px 18px;
      font-size:16px;
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 10px 18px rgba(0,0,0,.10);
      font-weight:900;
    }

    .toast{
      display:none;
      margin-top:10px;
      font-size:34px;
      font-weight:950;
      opacity:.95;
      animation:pop .35s ease;
    }

    #round6Image{
      display:none;
      width:100%;
      max-width:460px;
      margin:16px auto 0;
      border-radius:14px;
      box-shadow:0 12px 30px rgba(0,0,0,.25);
      animation:pop .35s ease;
    }

    .result{
      display:none;
      margin-top:18px;
      animation:pop .35s ease;
    }
    .result h2{ font-size:clamp(30px,4.5vw,46px); margin:10px 0; }
    .loveText{ font-size:22px; font-weight:900; color:#ff1f68; margin-top:8px; }

    @keyframes pop{
      from{transform:scale(.96); opacity:0}
      to{transform:scale(1); opacity:1}
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>
  <div id="hearts"></div>

  <!-- music -->
  <iframe id="ytMusic" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>

  <div class="wrap">
    <main class="card">
      <h1 id="title"></h1>
      <p class="text" id="text"></p>

      <div class="button-zone" id="zone">
        <button id="btnA" class="btn-main"></button>
        <button id="btnB" class="btn-main"></button>
      </div>

      <div class="actions" id="actions"></div>
      <div class="toast" id="toast">NO 😢</div>

      <!-- Round 6 image -->
      <img id="round6Image" src="round6.gif" alt="round 6 moment" />

      <div class="hint" id="hint"></div>

      <section class="result" id="result">
        <h2>YAY! 🎉</h2>
        <div class="loveText" id="finalText">I was hoping you'd say yes 💖</div>
      </section>
    </main>
  </div>

  <script>
    const titleEl = document.getElementById("title");
    const textEl = document.getElementById("text");
    const zone = document.getElementById("zone");
    const btnA = document.getElementById("btnA");
    const btnB = document.getElementById("btnB");
    const actions = document.getElementById("actions");
    const hint = document.getElementById("hint");
    const toast = document.getElementById("toast");
    const round6Image = document.getElementById("round6Image");
    const result = document.getElementById("result");

    // confetti + hearts
    const confettiCanvas = document.getElementById("confettiCanvas");
    const confettiInstance = window.confetti
      ? confetti.create(confettiCanvas,{resize:true,useWorker:true})
      : null;

    function fullScreenConfetti(){
      if(!confettiInstance) return;
      confettiInstance({particleCount:280,spread:160,origin:{x:.5,y:.6}});
    }

    const hearts = document.getElementById("hearts");
    function createHeart(){
      const span=document.createElement("span");
      span.innerHTML="💖";
      span.style.left=Math.random()*100+"vw";
      span.style.animationDuration=4+Math.random()*4+"s";
      hearts.appendChild(span);
      setTimeout(()=>span.remove(),8000);
    }

    // helpers
    function show(el){ el.style.display = "block"; }
    function hide(el){ el.style.display = "none"; }
    function setHint(html){ hint.innerHTML = html || ""; }
    function setToast(text, ms=1100){
      toast.textContent = text;
      show(toast);
      if(ms>0) setTimeout(()=>hide(toast), ms);
    }
    function clearActions(){ actions.innerHTML = ""; }
    function addAction(label, onClick){
      const b = document.createElement("button");
      b.className = "btn-option";
      b.textContent = label;
      b.onclick = onClick;
      actions.appendChild(b);
    }
    function resetUI(){
      hide(toast);
      hide(round6Image);
      hide(result);
      clearActions();
      setHint("");
      // show zone by default; screens can hide it
      show(zone);
      btnA.onclick = null;
      btnB.onclick = null;
    }

    // moving buttons helpers
    function placeButtons(aLeftPct=18, bLeftPct=62){
      btnA.style.left = aLeftPct + "%";
      btnA.style.top = "50%";
      btnA.style.transform = "translateY(-50%)";
      btnB.style.left = bLeftPct + "%";
      btnB.style.top = "50%";
      btnB.style.transform = "translateY(-50%)";
    }
    placeButtons();

    function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

    function near(btn, px, py, dist){
      const r = btn.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top + r.height/2;
      return Math.hypot(cx-px, cy-py) < dist;
    }

    function dodge(btn, px, py, strength){
      const z = zone.getBoundingClientRect();
      const b = btn.getBoundingClientRect();
      const cx = b.left + b.width/2;
      const cy = b.top + b.height/2;

      let dx = cx - px;
      let dy = cy - py;
      let mag = Math.hypot(dx,dy) || 1;
      dx/=mag; dy/=mag;

      let newLeft = (b.left - z.left) + dx*strength;
      let newTop  = (b.top  - z.top ) + dy*strength;

      btn.style.left = clamp(newLeft, 0, z.width - b.width) + "px";
      btn.style.top  = clamp(newTop , 0, z.height - b.height) + "px";
      btn.style.transform = "translateY(-50%)";
    }

    // state
    let screen = 0;
    let r2Picked = false;
    let r3Mode = null; // "think" | "feel"

    // pointer behavior depends on screen
    zone.addEventListener("pointermove", (e)=>{
      const px=e.clientX, py=e.clientY;

      // Screen 1 (Round 1): YES dodges
      if(screen === 1){
        if(near(btnA, px, py, 150)) dodge(btnA, px, py, 140);
      }

      // Screen 3 (Round 2 game): NO dodges
      if(screen === 3){
        if(near(btnB, px, py, 165)) dodge(btnB, px, py, 170);
      }
    });

    function go(n){
      screen = n;
      resetUI();
      placeButtons();

      // --- SCREEN 0: intro ---
      if(screen === 0){
        titleEl.textContent = "Do you want to play a game?";
        textEl.textContent = "";
        btnA.textContent = "Yes";
        btnB.textContent = "No";
        setHint("");

        btnA.onclick = ()=> go(1);
        btnB.onclick = ()=> setToast("NO 😢", 900);
        return;
      }

      // --- SCREEN 1: Round 1 (YES dodges, hint) ---
      if(screen === 1){
        titleEl.textContent = "Do you want to play a game?";
        textEl.textContent = "";
        btnA.textContent = "Yes";
        btnB.textContent = "No";
        setHint('Hint: Click <b>NO</b> for <b>YES</b> 👀');

        btnA.onclick = ()=> setToast("NO 😢", 900);
        btnB.onclick = ()=> go(2); // direct to next screen
        return;
      }

      // --- SCREEN 2: Round 1 result screen ---
      if(screen === 2){
        titleEl.textContent = "Okay… that was too easy 😅";
        textEl.textContent = "";
        hide(zone);
        addAction("Continue", ()=> go(3));
        return;
      }

      // --- SCREEN 3: Round 2 game (NO dodges, click YES => NO screen) ---
      if(screen === 3){
        r2Picked = false;
        titleEl.textContent = "Try clicking YES.";
        textEl.textContent = "";
        btnA.textContent = "Yes";
        btnB.textContent = "No";
        setHint("");

        btnA.onclick = ()=> go(4);
        btnB.onclick = ()=> setToast("NO 😢", 800);
        return;
      }

      // --- SCREEN 4: Round 2 NO screen + question ---
      if(screen === 4){
        titleEl.textContent = "NO 😢";
        textEl.textContent = "Be honest… what are you thinking right now?";
        hide(zone);

        clearActions();
        addAction("I’m confused 😵‍💫", ()=> go(5));
        addAction("This is kinda fun 😏", ()=> go(5));
        addAction("Why am I smiling right now", ()=> go(5));
        return;
      }

      // --- SCREEN 5: Round 3 intro (Choose wisely) ---
      if(screen === 5){
        titleEl.textContent = "Choose wisely.";
        textEl.textContent = "No pressure.";
        btnA.textContent = "Think";
        btnB.textContent = "Feel";
        setHint("");

        btnA.onclick = ()=> { r3Mode="think"; go(6); };
        btnB.onclick = ()=> { r3Mode="feel"; go(9); };
        return;
      }

      // --- THINK path screens 6-8 ---
      if(screen === 6 && r3Mode==="think"){
        titleEl.textContent = "Thinking a little?";
        textEl.textContent = "";
        hide(zone);
        addAction("Next", ()=> go(7));
        return;
      }
      if(screen === 7 && r3Mode==="think"){
        titleEl.textContent = "What was on your mind just now?";
        textEl.textContent = "";
        hide(zone);
        addAction("A lot", ()=> go(8));
        addAction("Everything", ()=> go(8));
        return;
      }
      if(screen === 8 && r3Mode==="think"){
        // we’ll read last click via a simple trick: keep text on button click
        // easiest: we infer from previous screen by storing a temp value
        // but for simplicity: show a single combined line
        titleEl.textContent = "Makes sense.";
        textEl.textContent = "I was kind of thinking about you too.";
        hide(zone);
        addAction("Tell me more 👀", ()=> go(12));
        return;
      }

      // --- FEEL path screens 9-11 ---
      if(screen === 9 && r3Mode==="feel"){
        titleEl.textContent = "Feeling person, huh.";
        textEl.textContent = "I had a feeling you’d pick this one.";
        hide(zone);
        addAction("Next", ()=> go(10));
        return;
      }
      if(screen === 10 && r3Mode==="feel"){
        titleEl.textContent = "What were you feeling just now?";
        textEl.textContent = "";
        hide(zone);
        addAction("Happy", ()=> go(11));
        addAction("Warm", ()=> go(11));
        addAction("Excited", ()=> go(11));
        return;
      }
      if(screen === 11 && r3Mode==="feel"){
        titleEl.textContent = "Makes sense.";
        textEl.textContent = "You’re pretty much describing me. And don’t worry… I think that about you too.";
        hide(zone);
        addAction("Okay, show me more 😄", ()=> go(12));
        return;
      }

      // --- SCREEN 12: Round 4 flirty text + Fair enough ---
      if(screen === 12){
        titleEl.textContent = "You know… this would’ve been way easier if I just asked.";
        textEl.textContent = "But where’s the fun in that?";
        hide(zone);
        addAction("Fair enough", ()=>{
          // show “I know, right?” for ~3s then round 5
          titleEl.textContent = "I know, right?";
          textEl.textContent = "";
          clearActions();
          setTimeout(()=> go(13), 3000);
        });
        return;
      }

      // --- SCREEN 13: Round 5 gift moment ---
      if(screen === 13){
        titleEl.textContent = "I don’t usually do things like this.";
        textEl.textContent = "But I wanted this to feel a little different.";
        hide(zone);

        addAction("That’s sweet 🥺", ()=> go(14));
        addAction("I like this 😊", ()=> go(14));
        return;
      }

      // --- SCREEN 14: after round5 choice ---
      if(screen === 14){
        titleEl.textContent = "Yeah… I’m glad you do.";
        textEl.textContent = "";
        hide(zone);
        addAction("Okay, show me more 😄", ()=> go(15));
        return;
      }

      // --- SCREEN 15: Round 6 pick buttons ---
      if(screen === 15){
        titleEl.textContent = "Okay… one last thing.";
        textEl.textContent = "Pick any button.";
        show(zone);
        btnA.textContent = "This one";
        btnB.textContent = "That one";
        placeButtons(22, 58);

        const pick = ()=> go(16);
        btnA.onclick = pick;
        btnB.onclick = pick;
        return;
      }

      // --- SCREEN 16: Round 6 image + slow text ---
      if(screen === 16){
        titleEl.textContent = "Interesting.";
        textEl.textContent = "";
        hide(zone);
        show(round6Image);

        clearActions();
        setTimeout(()=> { textEl.textContent = "That actually says more than you think."; }, 1600);
        setTimeout(()=> { textEl.textContent = "And that’s kind of why I did all of this."; }, 3400);
        setTimeout(()=> { go(17); }, 5200);
        return;
      }

      // --- SCREEN 17: Round 7 build-up ---
      if(screen === 17){
        hide(zone);
        hide(round6Image);
        titleEl.textContent = "I still have a lot of things I want to ask you someday…";
        textEl.textContent = "";

        const lines = [
          "To live together.",
          "To marry you.",
          "To have kids with you.",
          "But right now…",
          "There’s only one thing I can ask."
        ];
        let i = 0;

        clearActions();
        const tick = ()=>{
          if(i >= lines.length){
            go(18);
            return;
          }
          titleEl.textContent = lines[i];
          i++;
          setTimeout(tick, 1250);
        };
        setTimeout(tick, 1250);
        return;
      }

      // --- SCREEN 18: Final question + choices ---
      if(screen === 18){
        hide(zone);
        titleEl.textContent = "Will you be my Valentine? 💖";
        textEl.textContent = "";
        clearActions();

        const yes = ()=> celebrate();
        addAction("Yes 💖", yes);
        addAction("Definitely 😌", yes);
        addAction("Of course 🥰", yes);
        return;
      }
    }

    function celebrate(){
      clearActions();
      // music (after user interaction: should play most of the time)
      document.getElementById("ytMusic").src =
        "https://www.youtube.com/embed/5sMKX22BHeE?autoplay=1&loop=1&playlist=5sMKX22BHeE";

      show(result);
      fullScreenConfetti();
      setInterval(createHeart, 300);
    }

    // Start
    go(0);
  </script>
</body>
</html>
