<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will you be my Valentine?</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
:root {
  --bg1:#ffd6e7; --bg2:#ffeef6; --card:#ffffffcc;
  --yes:#ff3b7a; --yesHover:#ff1f68;
}
*{box-sizing:border-box}

body{
  margin:0; min-height:100svh; display:grid; place-items:center;
  background:radial-gradient(circle at top,var(--bg2),var(--bg1));
  font-family:system-ui,sans-serif; overflow:hidden; padding:16px;
}

#confettiCanvas,#hearts{
  position:fixed; inset:0; width:100vw; height:100vh;
  pointer-events:none;
}

#hearts span{
  position:absolute; bottom:-20px;
  font-size:24px; animation:floatUp linear infinite;
  opacity:.9;
}
@keyframes floatUp{
  from{transform:translateY(0) scale(.8); opacity:1}
  to{transform:translateY(-110vh) scale(1.4); opacity:0}
}

.card{
  width:min(720px,92vw); padding:26px 22px;
  background:var(--card); backdrop-filter:blur(10px);
  border-radius:22px; text-align:center;
  box-shadow:0 18px 60px rgba(0,0,0,.15);
  position:relative; z-index:2;
}

h1{font-size:clamp(26px,4vw,44px); margin:12px 0 18px}

.button-zone{
  position:relative; width:min(520px,92%);
  height:160px; margin:0 auto; touch-action:none;
}

button{
  position:absolute; top:50%;
  padding:16px 24px; font-size:18px; font-weight:800;
  border-radius:999px; border:none; cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.14);
  transition:opacity .35s ease, filter .35s ease;
}

#yesBtn{
  left:18%;
  background:var(--yes); color:#fff;
  transform:translateY(-50%) scale(1);
  z-index:5;
}
#yesBtn:hover{background:var(--yesHover)}

#noBtn{
  left:62%;
  background:#e5e7eb;
  top:50%;
  transform:translateY(-50%);
}

.hint{margin-top:10px; font-size:13px; opacity:.7}

.result{display:none; margin-top:18px; animation:pop .35s ease}
.result h2{font-size:clamp(30px,4.5vw,46px); margin:10px 0}
.loveText{font-size:22px; font-weight:700; color:#ff1f68; margin-top:8px}

@keyframes pop{
  from{transform:scale(.96); opacity:0}
  to{transform:scale(1); opacity:1}
}

/* ✅ Fullscreen YES: GEEN transform scaling meer (dus geen rare laptop vervorming) */
.yes-fullscreen{
  position:fixed !important;
  inset:0 !important;
  width:100vw !important;
  height:100vh !important;
  left:0 !important;
  top:0 !important;

  transform:none !important;          /* belangrijk: voorkomt rare scaling */
  border-radius:0 !important;

  display:flex !important;
  align-items:center !important;
  justify-content:center !important;

  font-size:clamp(28px,7vw,72px) !important;
  z-index:9999 !important;
  box-shadow:none !important;
}
</style>
</head>

<body>

<canvas id="confettiCanvas"></canvas>
<div id="hearts"></div>

<!-- YouTube muziek -->
<iframe id="ytMusic" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>

<main class="card">
  <h1>Hey Ofelia… will you be my Valentine? 💖</h1>

  <section class="button-zone" id="zone">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </section>

  <div class="hint" id="hint">“No” seems a bit shy 😈</div>

  <section class="result" id="result">
    <h2>YAY! 🎉</h2>
    <div class="loveText">I knew you'd say yes ❤️</div>
  </section>
</main>

<script>
const zone=document.getElementById("zone");
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const result=document.getElementById("result");
const hint=document.getElementById("hint");
const hearts=document.getElementById("hearts");

const confettiCanvas=document.getElementById("confettiCanvas");
const confettiInstance=window.confetti
  ? confetti.create(confettiCanvas,{resize:true,useWorker:true})
  : null;

function fullScreenConfetti(){
  if(!confettiInstance) return;
  confettiInstance({particleCount:280,spread:160,origin:{x:.5,y:.6}});
}

function clamp(n,min,max){return Math.max(min,Math.min(max,n))}

function createHeart(){
  const span=document.createElement("span");
  span.innerHTML="💖";
  span.style.left=Math.random()*100+"vw";
  span.style.animationDuration=4+Math.random()*4+"s";
  hearts.appendChild(span);
  setTimeout(()=>span.remove(),8000);
}

/* ✅ YES groeit trager + fullscreen pas laat */
let yesScale=1;
let yesIsFullscreen=false;

const YES_GROW_STEP = 0.05;     // ✅ trager (was veel te snel)
const YES_FULLSCREEN_AT = 2.6;  // ✅ pas later fullscreen (zet hoger = nog later)

function setYesTransform(){
  // zolang niet fullscreen: normale scaling in de zone
  yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
}

function makeYesFullscreen(){
  if(yesIsFullscreen) return;
  yesIsFullscreen=true;

  // reset alle “zone” positioning die rare effects kan geven
  yesBtn.classList.add("yes-fullscreen");
  yesBtn.style.left = "0";
  yesBtn.style.top  = "0";

  // tekst een beetje leuker
  yesBtn.textContent = "YES 💖";
}

function growYes(){
  if(yesIsFullscreen) return;

  yesScale = Math.min(10, yesScale + YES_GROW_STEP);
  setYesTransform();

  if(yesScale >= YES_FULLSCREEN_AT){
    makeYesFullscreen();
  }
}

/* ✅ NO verdwijnt traag (zelfde timing, kan je tunen) */
const NO_FADE_START_MS = 25000; // start fade na 25s
const NO_GONE_MS = 40000;       // volledig weg na 40s (iets trager gemaakt)

let startTime = Date.now();
let noHidden = false;

function updateNoTimer(){
  if(noHidden) return;
  const elapsed = Date.now() - startTime;

  if(elapsed < NO_FADE_START_MS) return;

  const t = clamp((elapsed - NO_FADE_START_MS) / (NO_GONE_MS - NO_FADE_START_MS), 0, 1);
  noBtn.style.opacity = String(1 - t);
  noBtn.style.filter = `blur(${t*2}px)`;

  if(t >= 1){
    noBtn.style.display = "none";
    noHidden = true;
    hint.textContent = "Okayyy… only YES left 😇";
  }
}
setInterval(updateNoTimer, 200);

/* ✅ NO springt weg + YES groeit langzaam */
function moveNo(px,py){
  if(noHidden) return;

  const z=zone.getBoundingClientRect();
  const b=noBtn.getBoundingClientRect();

  let dx=(b.left+b.width/2)-px;
  let dy=(b.top+b.height/2)-py;
  let mag=Math.hypot(dx,dy)||1;
  dx/=mag; dy/=mag;

  let newLeft=(b.left-z.left)+dx*140;
  let newTop =(b.top -z.top )+dy*140;

  noBtn.style.left=clamp(newLeft,0,z.width-b.width)+"px";
  noBtn.style.top =clamp(newTop ,0,z.height-b.height)+"px";
  noBtn.style.transform="translateY(-50%)";

  growYes();
}

zone.addEventListener("pointermove",e=>{
  if(noHidden) return;
  const b=noBtn.getBoundingClientRect();
  const d=Math.hypot((b.left+b.width/2)-e.clientX,(b.top+b.height/2)-e.clientY);
  if(d<140) moveNo(e.clientX,e.clientY);
});

function celebrate(){
  zone.style.display="none";
  hint.style.display="none";
  result.style.display="block";

  fullScreenConfetti();
  setInterval(createHeart,300);
}

yesBtn.addEventListener("click",()=>{
  document.getElementById("ytMusic").src =
    "https://www.youtube.com/embed/5sMKX22BHeE?autoplay=1&loop=1&playlist=5sMKX22BHeE";

  if(yesIsFullscreen){
    yesBtn.textContent="YAAAY 🎉";
  }
  celebrate();
});
</script>

</body>
</html>
