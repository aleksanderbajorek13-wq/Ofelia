<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Valentine Game</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#fff4c2;
      --bg2:#fff9dd;
      --card:#ffffffcc;
      --yes:#ff3b7a; --yesHover:#ff1f68;
      --ink:#111827;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100svh;
      display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at top,var(--bg2),var(--bg1));
      font-family:system-ui,sans-serif;
      overflow:hidden;
      padding:16px;
      color:var(--ink);
    }
    .wrap{ width:100%; display:flex; justify-content:center; transform:translateY(-18px); }

    #confettiCanvas,#hearts{
      position:fixed; inset:0; width:100vw; height:100vh;
      pointer-events:none;
    }
    #hearts span{
      position:absolute; bottom:-20px;
      font-size:24px; animation:floatUp linear infinite;
      opacity:.9;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));
    }
    @keyframes floatUp{
      from{transform:translateY(0) scale(.8); opacity:1}
      to{transform:translateY(-110vh) scale(1.4); opacity:0}
    }

    .card{
      width:min(720px,92vw);
      padding:26px 22px;
      background:var(--card);
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.15);
      position:relative;
    }

    @keyframes wiggle {
      0%   { transform:translateX(0); }
      15%  { transform:translateX(-10px) rotate(-1deg); }
      30%  { transform:translateX(10px) rotate(1deg); }
      45%  { transform:translateX(-8px) rotate(-1deg); }
      60%  { transform:translateX(8px) rotate(1deg); }
      75%  { transform:translateX(-5px); }
      100% { transform:translateX(0); }
    }
    .wiggle { animation: wiggle .45s ease; }

    h1{
      font-size:clamp(26px,4.2vw,46px);
      margin:8px 0 8px;
      font-weight:900;
      letter-spacing:-.02em;
      user-select:none;
    }
    .text{
      font-size:16px;
      opacity:.9;
      margin:0 auto 14px;
      max-width:56ch;
      line-height:1.35;
      min-height:22px;
      white-space:pre-line;
    }

    .hint{
      margin-top:14px;
      font-size:13px;
      opacity:.82;
      min-height:18px;
      cursor:default;
      user-select:none;
    }
    .hint.clickable{
      cursor:pointer;
      text-decoration:underline;
      text-underline-offset:3px;
    }

    .button-zone{
      position:relative;
      width:min(540px,96%);
      height:170px;
      margin:10px auto 0;
      touch-action:none;
    }

    button{
      border:none; cursor:pointer; font-weight:900;
      border-radius:999px;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      user-select:none;
    }

    .btn-main{
      position:absolute;
      padding:16px 24px;
      font-size:18px;
    }

    #btnA{
      background:var(--yes);
      color:#fff;
      box-shadow:
        0 10px 24px rgba(0,0,0,.14),
        0 0 22px rgba(255, 215, 100, .55);
    }
    #btnA:hover{ background:var(--yesHover); }

    #btnB{
      background:#e5e7eb;
      color:#111;
      box-shadow:
        0 10px 24px rgba(0,0,0,.14),
        0 0 18px rgba(255, 182, 193, .55);
    }

    .actions{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .btn-option{
      padding:14px 18px;
      font-size:16px;
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 10px 18px rgba(0,0,0,.10);
      font-weight:900;
    }

    .toast{
      display:none;
      margin-top:10px;
      font-size:34px;
      font-weight:950;
      opacity:.95;
      animation:pop .35s ease;
      min-height:40px;
    }

    .result{
      display:none;
      margin-top:18px;
      animation:pop .35s ease;
    }
    .result h2{ font-size:clamp(30px,4.5vw,46px); margin:10px 0; }
    .loveText{ font-size:22px; font-weight:900; color:#ff1f68; margin-top:8px; }

    .oneLink{
      text-decoration:none;
      color:inherit;
      cursor:pointer;
      padding:0 2px;
      border-radius:6px;
    }
    @media (hover:hover){
      .oneLink:hover{ background:rgba(0,0,0,.06); }
    }

    @keyframes pop{
      from{transform:scale(.96); opacity:0}
      to{transform:scale(1); opacity:1}
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>
  <div id="hearts"></div>

  <iframe id="ytMusic"
    width="0" height="0"
    src=""
    frameborder="0"
    allow="autoplay; encrypted-media; picture-in-picture"
    referrerpolicy="origin"
  ></iframe>

  <div class="wrap">
    <main class="card" id="card">
      <h1 id="title"></h1>
      <p class="text" id="text"></p>

      <div class="button-zone" id="zone">
        <button id="btnA" class="btn-main"></button>
        <button id="btnB" class="btn-main"></button>
      </div>

      <div class="actions" id="actions"></div>
      <div class="toast" id="toast"></div>
      <div class="hint" id="hint"></div>

      <section class="result" id="result">
        <h2>YAY! 🎉</h2>
        <div class="loveText" id="finalText">I was hoping you'd say yes 💖</div>
      </section>
    </main>
  </div>

  <script>
    const card = document.getElementById("card");
    const titleEl = document.getElementById("title");
    const textEl = document.getElementById("text");
    const zone = document.getElementById("zone");
    const btnA = document.getElementById("btnA");
    const btnB = document.getElementById("btnB");
    const actions = document.getElementById("actions");
    const hint = document.getElementById("hint");
    const toast = document.getElementById("toast");
    const result = document.getElementById("result");
    const ytMusic = document.getElementById("ytMusic");

    const confettiCanvas = document.getElementById("confettiCanvas");
    const confettiInstance = window.confetti
      ? confetti.create(confettiCanvas,{resize:true,useWorker:true})
      : null;

    function fullScreenConfetti(){
      if(!confettiInstance) return;
      confettiInstance({
        particleCount:280,
        spread:160,
        origin:{x:.5,y:.6},
        colors:["#ffe066","#fff3bf","#ffffff","#ffd6e7"]
      });
    }

    const hearts = document.getElementById("hearts");
    function createHeart(){
      const span=document.createElement("span");
      span.innerHTML = Math.random() > 0.5 ? "💛" : "🌼";
      span.style.left=Math.random()*100+"vw";
      span.style.animationDuration=4+Math.random()*4+"s";
      hearts.appendChild(span);
      setTimeout(()=>span.remove(),8000);
    }

    function show(el){ el.style.display = "block"; }
    function hide(el){ el.style.display = "none"; }
    function setHint(html){ hint.innerHTML = html || ""; }
    function clearActions(){ actions.innerHTML = ""; }
    function addAction(label, onClick){
      const b = document.createElement("button");
      b.className = "btn-option";
      b.textContent = label;
      b.onclick = onClick;
      actions.appendChild(b);
    }
    function setToast(text, ms=1100){
      toast.textContent = text;
      show(toast);
      if(ms>0) setTimeout(()=>hide(toast), ms);
    }
    function wiggleCard(){
      card.classList.remove("wiggle");
      void card.offsetWidth;
      card.classList.add("wiggle");
    }
    function safeGet(key){
      try { return localStorage.getItem(key); } catch(e){ return null; }
    }
    function safeSet(key, val){
      try { localStorage.setItem(key, val); } catch(e){}
    }

    // ✅ MUSIC: start exactly on screen 19 (This one / That one)
    const YT_ID = "5sMKX22BHeE";
    let musicStarted = false;
    let unmuteArmed = false;

    function startMusicSoft(){
      // start muted autoplay (allowed)
      ytMusic.src =
        `https://www.youtube.com/embed/${YT_ID}` +
        `?autoplay=1&mute=1&loop=1&playlist=${YT_ID}&playsinline=1&controls=0`;
      musicStarted = true;
    }
    function unmuteMusic(){
      ytMusic.src =
        `https://www.youtube.com/embed/${YT_ID}` +
        `?autoplay=1&mute=0&loop=1&playlist=${YT_ID}&playsinline=1&controls=0`;
      musicStarted = true;
    }
    function stopMusic(){
      ytMusic.src = "";
      musicStarted = false;
    }
    function armUnmute(message="Tap anywhere for sound 🔊"){
      if(!musicStarted) return;
      if(unmuteArmed) return;
      unmuteArmed = true;
      setHint(message);
      card.onpointerdown = ()=>{
        if(!unmuteArmed) return;
        unmuteArmed = false;
        setHint("");
        unmuteMusic();
        card.onpointerdown = null;
      };
    }

    function resetUI(){
      hide(toast);
      hide(result);
      clearActions();
      setHint("");
      hint.classList.remove("clickable");
      hint.onclick = null;

      show(zone);

      btnA.onclick = null;
      btnB.onclick = null;

      btnA.style.pointerEvents = "auto";
      btnB.style.pointerEvents = "auto";

      btnA.style.display = "block";
      btnB.style.display = "block";

      // keep music running once started; only stop on full restart (screen 0)
      unmuteArmed = false;
      card.onpointerdown = null;
    }

    function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

    function placeButtons(aLeftPct=18, bLeftPct=62){
      const z = zone.getBoundingClientRect();
      const a = btnA.getBoundingClientRect();
      const b = btnB.getBoundingClientRect();

      const aLeftPx = (z.width * (aLeftPct/100));
      const bLeftPx = (z.width * (bLeftPct/100));

      btnA.style.left = clamp(aLeftPx, 0, z.width - a.width) + "px";
      btnB.style.left = clamp(bLeftPx, 0, z.width - b.width) + "px";

      const centerTopA = (z.height - a.height) / 2;
      const centerTopB = (z.height - b.height) / 2;

      btnA.style.top = centerTopA + "px";
      btnB.style.top = centerTopB + "px";

      btnA.style.transform = "translate(0,0)";
      btnB.style.transform = "translate(0,0)";
    }

    function dodge(btn, px, py, strength){
      const z = zone.getBoundingClientRect();
      const b = btn.getBoundingClientRect();
      const cx = b.left + b.width/2;
      const cy = b.top + b.height/2;

      let dx = cx - px;
      let dy = cy - py;
      let mag = Math.hypot(dx,dy) || 1;
      dx/=mag; dy/=mag;

      let newLeft = (b.left - z.left) + dx*strength;
      let newTop  = (b.top  - z.top ) + dy*strength;

      btn.style.left = clamp(newLeft, 0, z.width - b.width) + "px";
      btn.style.top  = clamp(newTop , 0, z.height - b.height) + "px";
      btn.style.transform = "translate(0,0)";
    }

    function near(btn, px, py, dist){
      const r = btn.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top + r.height/2;
      return Math.hypot(cx-px, cy-py) < dist;
    }

    function moveYesRandom(){
      const z = zone.getBoundingClientRect();
      const b = btnA.getBoundingClientRect();
      const maxLeft = z.width - b.width;
      const maxTop  = z.height - b.height;

      const left = Math.random() * Math.max(0, maxLeft);
      const top  = Math.random() * Math.max(0, maxTop);

      btnA.style.left = left + "px";
      btnA.style.top  = top + "px";
      btnA.style.transform = "translate(0,0)";
    }

    // STATE
    let screen = 0;
    let r1YesClicks = 0;
    let r2YesClicks = 0;
    let r3Mode = null;
    let r3ThinkPick = null;
    let oneUnlocked = false;

    let lastThoughtPick = null;
    let secretTitleClicks = 0;
    let secretTitleArmed = true;

    let obeyTimer = null;
    let obeyActive = false;

    titleEl.style.cursor = "pointer";
    titleEl.addEventListener("click", ()=>{
      if(!secretTitleArmed) return;
      if(screen > 10) return;
      secretTitleClicks++;
      if(secretTitleClicks === 7){
        setToast("Okay wow… you’re curious. That’s kinda attractive 😳", 1800);
        wiggleCard();
        secretTitleClicks = 0;
      }
    });

    zone.addEventListener("pointermove", (e)=>{
      const px=e.clientX, py=e.clientY;
      if(screen === 1){
        if(near(btnA, px, py, 150)) dodge(btnA, px, py, 140);
      }
    });

    function setIntroTitle(){
      const isReturn = !!safeGet("playedBefore");
      const first = [
        "Do you want to play a game?",
        "Quick question…",
        "Okay, be honest for a second 👀",
        "Do you want to play a little game?",
        "This might be fun 😏"
      ];
      const ret = [
        "Round two? Bold move 😏",
        "Back already? Interesting.",
        "Couldn’t stay away, huh?",
        "Okay… again? I like that 😌"
      ];
      const pool = isReturn ? ret : first;
      titleEl.textContent = pool[Math.floor(Math.random()*pool.length)];
    }

    function go(n){
      screen = n;
      resetUI();
      requestAnimationFrame(()=>{ placeButtons(); });
      textEl.textContent = "";
      oneUnlocked = false;

      if(screen === 0){
        stopMusic(); // ✅ full reset stops music
        setIntroTitle();

        btnA.textContent = "Yes";
        btnB.textContent = "No";
        setHint("");

        secretTitleArmed = true;
        secretTitleClicks = 0;

        btnA.onclick = ()=> go(1);
        btnB.onclick = ()=>{
          setToast("NO 😢", 1100);
          wiggleCard();
        };
        return;
      }

      if(screen === 1){
        titleEl.textContent = "Try clicking yes.";
        btnA.textContent = "Yes";
        btnB.textContent = "No";
        r1YesClicks = 0;
        setHint("");
        requestAnimationFrame(()=> placeButtons(62, 18));

        btnA.onclick = ()=>{
          r1YesClicks++;
          setHint("NO 😢");
          if(r1YesClicks >= 3){
            setHint('Hint: Click <b>NO</b> for <b>YES</b> 👀');
          }
        };
        btnB.onclick = ()=> go(2);
        return;
      }

      if(screen === 2){
        titleEl.textContent = "Okay… that was too easy 😅";
        hide(zone);
        addAction("Continue", ()=> go(3));
        return;
      }

      if(screen === 3){
        titleEl.textContent = "Okay, try this.";
        btnA.textContent = "Yes";
        btnB.style.display = "none";
        setHint("");
        r2YesClicks = 0;

        btnA.onclick = ()=>{
          r2YesClicks++;
          if(r2YesClicks === 2) setHint("Ah, keep going.");
          if(r2YesClicks === 3) setHint("You’re almost there.");
          if(r2YesClicks === 4) setHint("You’re doing it, honey.");
          if(r2YesClicks < 5){ moveYesRandom(); return; }
          go(4);
        };
        setTimeout(()=>moveYesRandom(), 150);
        return;
      }

      if(screen === 4){
        titleEl.textContent = "Be honest… what are you thinking right now?";
        hide(zone);
        addAction("I’m confused 😵‍💫", ()=> { lastThoughtPick="confused"; go(5); });
        addAction("This is kinda fun 😏", ()=> { lastThoughtPick="fun"; go(5); });
        addAction("Why am I smiling right now", ()=> { lastThoughtPick="smiling"; go(5); });
        return;
      }

      if(screen === 5){
        titleEl.textContent = "Okay…";
        textEl.textContent = "These buttons clearly can’t be trusted.";
        hide(zone);
        addAction("Next", ()=> go(6));
        return;
      }

      if(screen === 6){
        titleEl.textContent = "So let’s try something else.";
        textEl.textContent = "You’re not allowed to click yes or no.";
        hide(zone);
        addAction("Next", ()=> go(7));
        return;
      }

      if(screen === 7){
        titleEl.innerHTML = `Choose <span class="oneLink" id="oneLink">one</span>.`;
        btnA.textContent = "Yes";
        btnB.textContent = "No";
        setHint("");

        const oneLink = document.getElementById("oneLink");
        oneLink.onclick = ()=>{
          oneUnlocked = true;
          setToast("Nice catch 😌", 1000);
          go(8);
        };

        const hintNudgeA = "Hmm… are you sure the answer is a button?";
        const hintNudgeB = "Look closely at what you’re being asked to do.";

        btnA.onclick = ()=>{
          setHint(hintNudgeA);
          hint.classList.add("clickable");
          hint.onclick = ()=> setHint("Sometimes the right choice is hiding in plain sight.");
        };

        btnB.onclick = ()=>{
          setHint(hintNudgeB);
          hint.classList.add("clickable");
          hint.onclick = ()=> setHint("Try focusing on the sentence itself… not the options.");
        };
        return;
      }

      if(screen === 8){
        titleEl.textContent = "Choose wisely.";
        textEl.textContent = "No pressure.";
        btnA.textContent = "Think";
        btnB.textContent = "Feel";
        setHint("");
        secretTitleArmed = false;
        btnA.onclick = ()=> { r3Mode="think"; go(9); };
        btnB.onclick = ()=> { r3Mode="feel";  go(13); };
        return;
      }

      if(screen === 9 && r3Mode==="think"){
        titleEl.textContent = "Thinking a little?";
        hide(zone);
        addAction("Next", ()=> go(10));
        return;
      }
      if(screen === 10 && r3Mode==="think"){
        titleEl.textContent = "What was on your mind just now?";
        hide(zone);
        addAction("A lot", ()=> { r3ThinkPick="A lot"; go(11); });
        addAction("Everything", ()=> { r3ThinkPick="Everything"; go(11); });
        return;
      }
      if(screen === 11 && r3Mode==="think"){
        hide(zone);
        if(r3ThinkPick === "A lot"){
          titleEl.textContent = "Ah… so basically, you’re thinking a lot about me.";
          textEl.textContent = "";
        } else {
          titleEl.textContent = "Yeah… that sounds about right.";
          textEl.textContent = "Including me.";
        }
        addAction("Next", ()=> go(12));
        return;
      }
      if(screen === 12 && r3Mode==="think"){
        let extra = "";
        if(lastThoughtPick === "fun") extra = "By the way… you said this was kinda fun. I noticed 😌";
        if(lastThoughtPick === "smiling") extra = "Also… you mentioned smiling. I noticed that too 😌";
        if(lastThoughtPick === "confused") extra = "And hey… even if you were confused— you still stayed. I noticed 😌";
        titleEl.textContent = "I was kind of thinking about you too.";
        textEl.textContent = extra;
        hide(zone);
        addAction("Tell me more 👀", ()=> go(16));
        return;
      }

      if(screen === 13 && r3Mode==="feel"){
        titleEl.textContent = "Feeling person, huh.";
        textEl.textContent = "I had a feeling you’d pick this one.";
        hide(zone);
        addAction("Next", ()=> go(14));
        return;
      }
      if(screen === 14 && r3Mode==="feel"){
        titleEl.textContent = "What were you feeling just now?";
        hide(zone);
        addAction("Happy", ()=> go(15));
        addAction("Warm", ()=> go(15));
        addAction("Excited", ()=> go(15));
        return;
      }
      if(screen === 15 && r3Mode==="feel"){
        let extra = "";
        if(lastThoughtPick === "fun") extra = "And earlier… you said this was kinda fun. I noticed 😌";
        if(lastThoughtPick === "smiling") extra = "And earlier… you said you were smiling. I noticed 😌";
        if(lastThoughtPick === "confused") extra = "And earlier… you said you were confused. It was cute 😌";
        titleEl.textContent = "Makes sense.";
        textEl.textContent =
          "You’re pretty much describing me. And don’t worry… I think that about you too."
          + (extra ? "\n\n" + extra : "");
        hide(zone);
        addAction("Okay, show me more 😄", ()=> go(16));
        return;
      }

      if(screen === 16){
        titleEl.textContent = "You know… this would’ve been way easier if I just asked.";
        textEl.textContent = "But where’s the fun in that?";
        hide(zone);
        addAction("Fair enough", ()=>{
          titleEl.textContent = "I know, right?";
          textEl.textContent = "";
          clearActions();
          setTimeout(()=> go(17), 3200);
        });
        return;
      }

      if(screen === 17){
        titleEl.textContent = "I don’t usually do things like this.";
        textEl.textContent = "But I wanted this to feel a little different.";
        hide(zone);
        addAction("That’s sweet 🥺", ()=> go(18));
        addAction("I like this 😊", ()=> go(18));
        return;
      }

      if(screen === 18){
        titleEl.textContent = "Yeah… I’m glad you do.";
        hide(zone);
        addAction("Okay, show me more 😄", ()=> go(18.5));
        return;
      }

      if(screen === 18.5){
        titleEl.textContent = "One tiny challenge.";
        textEl.textContent = "Don’t click anything for 5 seconds.";
        hide(zone);
        clearActions();
        setHint("");

        obeyActive = true;

        const onBadClick = ()=>{
          if(!obeyActive) return;
          obeyActive = false;
          card.removeEventListener("pointerdown", onBadClick, true);
          setToast("I said don’t 😏", 1400);
          wiggleCard();
          setTimeout(()=> go(19), 900);
        };
        card.addEventListener("pointerdown", onBadClick, true);

        if(obeyTimer) clearTimeout(obeyTimer);
        obeyTimer = setTimeout(()=>{
          if(!obeyActive) return;
          obeyActive = false;
          card.removeEventListener("pointerdown", onBadClick, true);
          titleEl.textContent = "Good.";
          textEl.textContent = "You listen well… that’s attractive 😌";
          setTimeout(()=> go(19), 1200);
        }, 5000);

        return;
      }

      // ✅ MUSIC STARTS ON THIS SLIDE (screen 19), not later
      if(screen === 19){
        titleEl.textContent = "Okay… one last thing.";
        textEl.textContent = "Pick any button.";
        show(zone);

        btnA.textContent = "This one";
        btnB.textContent = "That one";

        requestAnimationFrame(()=>placeButtons(22, 58));

        // ✅ start music immediately when this slide shows up
        // (muted autoplay, allowed)
        if(!musicStarted) startMusicSoft();

        // (optional) allow unmute now already
        armUnmute("Tap anywhere for sound 🔊");

        const pick = ()=> go(21);
        btnA.onclick = pick;
        btnB.onclick = pick;
        return;
      }

      if(screen === 21){
        hide(zone);
        titleEl.textContent = "I still have a lot of things I want to ask you someday…";
        textEl.textContent = "";
        clearActions();

        const lines = [
          "To live together.",
          "To marry you.",
          "To have kids with you.",
          "But right now…",
          "I know this is just a game… but I meant it.",
          "There’s only one thing I can ask."
        ];
        let i = 0;

        const delay = 2500;
        const tick = ()=>{
          if(i >= lines.length){
            go(22);
            return;
          }
          titleEl.textContent = lines[i];
          i++;
          setTimeout(tick, delay);
        };
        setTimeout(tick, delay);
        return;
      }

      if(screen === 22){
        hide(zone);
        titleEl.textContent = "Will you be my Valentine? 💖";
        textEl.textContent = "";
        clearActions();

        // keep music running
        armUnmute("Tap anywhere for sound 🔊");

        const yes = ()=> celebrate();
        addAction("Yes 💖", yes);
        addAction("Definitely 😌", yes);
        addAction("Of course 🥰", yes);
        return;
      }
    }

    let heartTimer = null;

    function celebrate(){
      clearActions();

      // ensure unmuted on YES click (user gesture)
      setHint("");
      unmuteArmed = false;
      unmuteMusic();

      show(result);
      fullScreenConfetti();

      if(heartTimer) clearInterval(heartTimer);
      heartTimer = setInterval(createHeart, 300);

      setTimeout(()=>{
        if(heartTimer) clearInterval(heartTimer);
        heartTimer = null;
      }, 25000);

      setTimeout(()=>{
        if(screen !== 22) return;
        titleEl.textContent = "Hey…";
        textEl.textContent = "you’re still here.";
        setTimeout(()=>{
          if(screen !== 22) return;
          textEl.textContent = "I like that.";
        }, 3000);
      }, 12000);

      setTimeout(()=>{
        addAction("Restart 🔁", ()=>{
          safeSet("playedBefore", "yes");
          go(0);
        });
      }, 15000);
    }

    go(0);
  </script>
</body>
</html>
