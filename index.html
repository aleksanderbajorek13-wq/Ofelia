<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Valentine Game</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7; --bg2:#ffeef6; --card:#ffffffcc;
      --yes:#ff3b7a; --yesHover:#ff1f68;
      --ink:#111827;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100svh;
      display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at top,var(--bg2),var(--bg1));
      font-family:system-ui,sans-serif;
      overflow:hidden;
      padding:16px;
      color:var(--ink);
    }
    .wrap{ width:100%; display:flex; justify-content:center; transform:translateY(-18px); }

    #confettiCanvas,#hearts{
      position:fixed; inset:0; width:100vw; height:100vh;
      pointer-events:none;
    }
    #hearts span{
      position:absolute; bottom:-20px;
      font-size:24px; animation:floatUp linear infinite;
      opacity:.9;
    }
    @keyframes floatUp{
      from{transform:translateY(0) scale(.8); opacity:1}
      to{transform:translateY(-110vh) scale(1.4); opacity:0}
    }

    .card{
      width:min(720px,92vw);
      padding:26px 22px;
      background:var(--card);
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.15);
      position:relative;
    }

    h1{
      font-size:clamp(26px,4.2vw,46px);
      margin:8px 0 8px;
      font-weight:900;
      letter-spacing:-.02em;
    }
    .text{
      font-size:16px;
      opacity:.9;
      margin:0 auto 14px;
      max-width:56ch;
      line-height:1.35;
      min-height:22px;
    }

    .hint{
      margin-top:14px;
      font-size:13px;
      opacity:.82;
      min-height:18px;
    }

    .button-zone{
      position:relative;
      width:min(540px,96%);
      height:170px;
      margin:10px auto 0;
      touch-action:none;
    }

    button{
      border:none; cursor:pointer; font-weight:900;
      border-radius:999px;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      user-select:none;
    }

    .btn-main{
      position:absolute;
      padding:16px 24px;
      font-size:18px;
    }
    #btnA{ background:var(--yes); color:#fff; }
    #btnA:hover{ background:var(--yesHover); }
    #btnB{ background:#e5e7eb; color:#111; }

    .actions{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .btn-option{
      padding:14px 18px;
      font-size:16px;
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 10px 18px rgba(0,0,0,.10);
      font-weight:900;
    }

    .toast{
      display:none;
      margin-top:10px;
      font-size:34px;
      font-weight:950;
      opacity:.95;
      animation:pop .35s ease;
      min-height:40px;
    }

    #round6Image{
      display:none;
      width:100%;
      max-width:460px;
      margin:16px auto 0;
      border-radius:14px;
      box-shadow:0 12px 30px rgba(0,0,0,.25);
      animation:pop .35s ease;
    }

    .result{
      display:none;
      margin-top:18px;
      animation:pop .35s ease;
    }
    .result h2{ font-size:clamp(30px,4.5vw,46px); margin:10px 0; }
    .loveText{ font-size:22px; font-weight:900; color:#ff1f68; margin-top:8px; }

    /* Hidden clickable word "one" */
    .oneLink{
      text-decoration:none;
      color:inherit;
      cursor:pointer;
      padding:0 2px;
      border-radius:6px;
    }
    /* Optional: very subtle hover hint on desktop only */
    @media (hover:hover){
      .oneLink:hover{ background:rgba(0,0,0,.06); }
    }

    @keyframes pop{
      from{transform:scale(.96); opacity:0}
      to{transform:scale(1); opacity:1}
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>
  <div id="hearts"></div>

  <iframe id="ytMusic" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>

  <div class="wrap">
    <main class="card">
      <h1 id="title"></h1>
      <p class="text" id="text"></p>

      <div class="button-zone" id="zone">
        <button id="btnA" class="btn-main"></button>
        <button id="btnB" class="btn-main"></button>
      </div>

      <div class="actions" id="actions"></div>
      <div class="toast" id="toast"></div>

      <!-- ✅ ronde 6 afbeelding: zet round6.gif naast index.html -->
      <img id="round6Image" src="round6.gif" alt="round 6 moment" />

      <div class="hint" id="hint"></div>

      <section class="result" id="result">
        <h2>YAY! 🎉</h2>
        <div class="loveText" id="finalText">I was hoping you'd say yes 💖</div>
      </section>
    </main>
  </div>

  <script>
    const titleEl = document.getElementById("title");
    const textEl = document.getElementById("text");
    const zone = document.getElementById("zone");
    const btnA = document.getElementById("btnA");
    const btnB = document.getElementById("btnB");
    const actions = document.getElementById("actions");
    const hint = document.getElementById("hint");
    const toast = document.getElementById("toast");
    const round6Image = document.getElementById("round6Image");
    const result = document.getElementById("result");

    // confetti + hearts
    const confettiCanvas = document.getElementById("confettiCanvas");
    const confettiInstance = window.confetti
      ? confetti.create(confettiCanvas,{resize:true,useWorker:true})
      : null;

    function fullScreenConfetti(){
      if(!confettiInstance) return;
      confettiInstance({particleCount:280,spread:160,origin:{x:.5,y:.6}});
    }

    const hearts = document.getElementById("hearts");
    function createHeart(){
      const span=document.createElement("span");
      span.innerHTML="💖";
      span.style.left=Math.random()*100+"vw";
      span.style.animationDuration=4+Math.random()*4+"s";
      hearts.appendChild(span);
      setTimeout(()=>span.remove(),8000);
    }

    // helpers
    function show(el){ el.style.display = "block"; }
    function hide(el){ el.style.display = "none"; }
    function setHint(html){ hint.innerHTML = html || ""; }
    function clearActions(){ actions.innerHTML = ""; }
    function addAction(label, onClick){
      const b = document.createElement("button");
      b.className = "btn-option";
      b.textContent = label;
      b.onclick = onClick;
      actions.appendChild(b);
    }
    function setToast(text, ms=1100){
      toast.textContent = text;
      show(toast);
      if(ms>0) setTimeout(()=>hide(toast), ms);
    }

    function resetUI(){
      hide(toast);
      hide(round6Image);
      hide(result);
      clearActions();
      setHint("");
      show(zone);
      btnA.onclick = null;
      btnB.onclick = null;
      btnA.style.pointerEvents = "auto";
      btnB.style.pointerEvents = "auto";
    }

    function placeButtons(aLeftPct=18, bLeftPct=62){
      btnA.style.left = aLeftPct + "%";
      btnA.style.top = "50%";
      btnA.style.transform = "translateY(-50%)";
      btnB.style.left = bLeftPct + "%";
      btnB.style.top = "50%";
      btnB.style.transform = "translateY(-50%)";
    }
    placeButtons();

    function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
    function dodge(btn, px, py, strength){
      const z = zone.getBoundingClientRect();
      const b = btn.getBoundingClientRect();
      const cx = b.left + b.width/2;
      const cy = b.top + b.height/2;

      let dx = cx - px;
      let dy = cy - py;
      let mag = Math.hypot(dx,dy) || 1;
      dx/=mag; dy/=mag;

      let newLeft = (b.left - z.left) + dx*strength;
      let newTop  = (b.top  - z.top ) + dy*strength;

      btn.style.left = clamp(newLeft, 0, z.width - b.width) + "px";
      btn.style.top  = clamp(newTop , 0, z.height - b.height) + "px";
      btn.style.transform = "translateY(-50%)";
    }
    function near(btn, px, py, dist){
      const r = btn.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top + r.height/2;
      return Math.hypot(cx-px, cy-py) < dist;
    }

    // STATE
    let screen = 0;
    let r2YesClicks = 0;         // for 5 jumps then success
    let r3Mode = null;
    let r3ThinkPick = null;
    let oneUnlocked = false;

    // Pointer behaviour (only where needed)
    zone.addEventListener("pointermove", (e)=>{
      const px=e.clientX, py=e.clientY;

      // ROUND 1: YES dodges
      if(screen === 1){
        if(near(btnA, px, py, 150)) dodge(btnA, px, py, 140);
      }
    });

    // Random move YES inside zone (for Round 2)
    function moveYesRandom(){
      const z = zone.getBoundingClientRect();
      const b = btnA.getBoundingClientRect();
      const maxLeft = z.width - b.width;
      const maxTop  = z.height - b.height;

      const left = Math.random() * Math.max(0, maxLeft);
      const top  = Math.random() * Math.max(0, maxTop);

      btnA.style.left = left + "px";
      btnA.style.top  = top + "px";
      btnA.style.transform = "translateY(-50%)";
    }

    function go(n){
      screen = n;
      resetUI();
      placeButtons();
      textEl.textContent = "";
      oneUnlocked = false;

      // ---------------- ROUND 0: INTRO ----------------
      if(screen === 0){
        titleEl.textContent = "Do you want to play a game?";
        btnA.textContent = "Yes";
        btnB.textContent = "No";
        setHint("");

        btnA.onclick = ()=> go(1);
        btnB.onclick = ()=> setToast("NO 😢", 1100);
        return;
      }

      // ---------------- ROUND 1: "Try clicking yes" ----------------
      if(screen === 1){
        titleEl.textContent = "Try clicking yes.";
        btnA.textContent = "Yes";
        btnB.textContent = "No";
        setHint('Hint: Click <b>NO</b> for <b>YES</b> 👀');

        btnA.onclick = ()=> setToast("NO 😢", 900);
        btnB.onclick = ()=> go(2);
        return;
      }

      // After Round 1
      if(screen === 2){
        titleEl.textContent = "Okay… that was too easy 😅";
        hide(zone);
        addAction("Continue", ()=> go(3));
        return;
      }

      // ---------------- ROUND 2: title "Okay, try this." (YES jumps 5x) ----------------
      if(screen === 3){
        titleEl.textContent = "Okay, try this.";
        textEl.textContent = "";
        btnA.textContent = "Yes";
        btnB.textContent = "No";
        setHint("");
        r2YesClicks = 0;

        // keep NO just there (no dodge)
        btnB.onclick = ()=> setToast("NO 😢", 700);

        btnA.onclick = ()=>{
          r2YesClicks++;

          // first 4 clicks: jump yes to a new spot
          if(r2YesClicks < 5){
            moveYesRandom();
            return;
          }

          // 5th click: go to thinking question screen
          go(4);
        };

        // start with a slightly off-center yes so it feels "alive"
        setTimeout(()=>moveYesRandom(), 150);
        return;
      }

      // Round 2 question screen
      if(screen === 4){
        titleEl.textContent = "Be honest… what are you thinking right now?";
        textEl.textContent = "";
        hide(zone);

        addAction("I’m confused 😵‍💫", ()=> go(5));
        addAction("This is kinda fun 😏", ()=> go(5));
        addAction("Why am I smiling right now", ()=> go(5));
        return;
      }

      // ---------------- Transitions to ROUND 3 ----------------
      if(screen === 5){
        titleEl.textContent = "Okay…";
        textEl.textContent = "These buttons clearly can’t be trusted.";
        hide(zone);
        addAction("Next", ()=> go(6));
        return;
      }

      if(screen === 6){
        titleEl.textContent = "So let’s try something else.";
        textEl.textContent = "You’re not allowed to click yes or no.";
        hide(zone);
        addAction("Next", ()=> go(7));
        return;
      }

      // ---------------- Hidden "one" slide ----------------
      if(screen === 7){
        // Title has a hidden clickable word "one"
        titleEl.innerHTML = `Choose <span class="oneLink" id="oneLink">one</span>.`;
        textEl.textContent = "";
        btnA.textContent = "Yes";
        btnB.textContent = "No";
        setHint("");

        // Hidden click target
        const oneLink = document.getElementById("oneLink");
        oneLink.onclick = ()=>{
          oneUnlocked = true;
          go(8);
        };

        btnA.onclick = ()=>{
          setHint("Tricky, right? 👀");
        };
        btnB.onclick = ()=>{
          setHint("Try and think harder…");
        };
        return;
      }

      // ---------------- ROUND 3: Choose wisely (Think / Feel) ----------------
      if(screen === 8){
        titleEl.textContent = "Choose wisely.";
        textEl.textContent = "No pressure.";
        btnA.textContent = "Think";
        btnB.textContent = "Feel";
        setHint("");

        btnA.onclick = ()=> { r3Mode="think"; go(9); };
        btnB.onclick = ()=> { r3Mode="feel";  go(13); };
        return;
      }

      // THINK path
      if(screen === 9 && r3Mode==="think"){
        titleEl.textContent = "Thinking a little?";
        hide(zone);
        addAction("Next", ()=> go(10));
        return;
      }
      if(screen === 10 && r3Mode==="think"){
        titleEl.textContent = "What was on your mind just now?";
        hide(zone);
        addAction("A lot", ()=> { r3ThinkPick="A lot"; go(11); });
        addAction("Everything", ()=> { r3ThinkPick="Everything"; go(11); });
        return;
      }
      if(screen === 11 && r3Mode==="think"){
        hide(zone);
        if(r3ThinkPick === "A lot"){
          titleEl.textContent = "Ah… so basically, you’re thinking a lot about me.";
          textEl.textContent = "";
        } else {
          titleEl.textContent = "Yeah… that sounds about right.";
          textEl.textContent = "Including me.";
        }
        addAction("Next", ()=> go(12));
        return;
      }
      if(screen === 12 && r3Mode==="think"){
        titleEl.textContent = "I was kind of thinking about you too.";
        textEl.textContent = "";
        hide(zone);
        addAction("Tell me more 👀", ()=> go(16));
        return;
      }

      // FEEL path (kept as earlier version)
      if(screen === 13 && r3Mode==="feel"){
        titleEl.textContent = "Feeling person, huh.";
        textEl.textContent = "I had a feeling you’d pick this one.";
        hide(zone);
        addAction("Next", ()=> go(14));
        return;
      }
      if(screen === 14 && r3Mode==="feel"){
        titleEl.textContent = "What were you feeling just now?";
        hide(zone);
        addAction("Happy", ()=> go(15));
        addAction("Warm", ()=> go(15));
        addAction("Excited", ()=> go(15));
        return;
      }
      if(screen === 15 && r3Mode==="feel"){
        titleEl.textContent = "Makes sense.";
        textEl.textContent = "You’re pretty much describing me. And don’t worry… I think that about you too.";
        hide(zone);
        addAction("Okay, show me more 😄", ()=> go(16));
        return;
      }

      // ---------------- ROUND 4 (text big + single button) ----------------
      if(screen === 16){
        titleEl.textContent = "You know… this would’ve been way easier if I just asked.";
        textEl.textContent = "But where’s the fun in that?";
        hide(zone);
        addAction("Fair enough", ()=>{
          titleEl.textContent = "I know, right?";
          textEl.textContent = "";
          clearActions();
          setTimeout(()=> go(17), 3200);
        });
        return;
      }

      // ---------------- ROUND 5 ----------------
      if(screen === 17){
        titleEl.textContent = "I don’t usually do things like this.";
        textEl.textContent = "But I wanted this to feel a little different.";
        hide(zone);

        addAction("That’s sweet 🥺", ()=> go(18));
        addAction("I like this 😊", ()=> go(18));
        return;
      }

      if(screen === 18){
        titleEl.textContent = "Yeah… I’m glad you do.";
        textEl.textContent = "";
        hide(zone);
        addAction("Okay, show me more 😄", ()=> go(19));
        return;
      }

      // ---------------- ROUND 6 pick ----------------
      if(screen === 19){
        titleEl.textContent = "Okay… one last thing.";
        textEl.textContent = "Pick any button.";
        show(zone);

        btnA.textContent = "This one";
        btnB.textContent = "That one";
        placeButtons(22, 58);

        const pick = ()=> go(20);
        btnA.onclick = pick;
        btnB.onclick = pick;
        return;
      }

      // Round 6 image + paced lines
      if(screen === 20){
        hide(zone);
        show(round6Image);
        titleEl.textContent = "Interesting.";
        textEl.textContent = "";

        clearActions();
        setTimeout(()=> { titleEl.textContent = "That actually says more than you think."; }, 1800);
        setTimeout(()=> { titleEl.textContent = "And that’s kind of why I did all of this."; }, 3800);
        setTimeout(()=> { go(21); }, 6200);
        return;
      }

      // ---------------- ROUND 7 slower build-up (2.5s) ----------------
      if(screen === 21){
        hide(zone);
        hide(round6Image);

        titleEl.textContent = "I still have a lot of things I want to ask you someday…";
        textEl.textContent = "";
        clearActions();

        const lines = [
          "To live together.",
          "To marry you.",
          "To have kids with you.",
          "But right now…",
          "There’s only one thing I can ask."
        ];
        let i = 0;

        const delay = 2500; // ✅ as requested
        const tick = ()=>{
          if(i >= lines.length){
            go(22);
            return;
          }
          titleEl.textContent = lines[i];
          i++;
          setTimeout(tick, delay);
        };
        setTimeout(tick, delay);
        return;
      }

      // Final question + choices
      if(screen === 22){
        hide(zone);
        titleEl.textContent = "Will you be my Valentine? 💖";
        textEl.textContent = "";
        clearActions();

        const yes = ()=> celebrate();
        addAction("Yes 💖", yes);
        addAction("Definitely 😌", yes);
        addAction("Of course 🥰", yes);
        return;
      }
    }

    function celebrate(){
      clearActions();
      document.getElementById("ytMusic").src =
        "https://www.youtube.com/embed/5sMKX22BHeE?autoplay=1&loop=1&playlist=5sMKX22BHeE";

      show(result);
      fullScreenConfetti();
      setInterval(createHeart, 300);
    }

    // Start at ROUND 0
    go(0);
  </script>
</body>
</html>
